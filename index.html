<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventario CUN</title>
<style>body{font:17px Arial;background:#f1f5f9;color:#142e43;margin:40px auto;max-width:1050px;padding:20px}h1{font-size:38px}section{background:white;padding:24px;margin:22px 0;border-radius:10px}input,button{font:inherit;padding:12px;margin:5px;border:1px solid #b9c8d4;border-radius:5px}button{background:#075985;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:14px;border-bottom:1px solid #ddd}#estado{padding:16px;font-weight:bold}label{display:inline-block;font-size:14px}input{display:block;width:210px}small{color:#526879}</style>
<small>PROYECTO ACADÉMICO · CALIDAD DEL SOFTWARE</small><h1>Gestión de inventario</h1><p>Registra productos y controla entradas y salidas de existencias.</p>
<section><h2>Nuevo producto</h2><form id="alta"><label>SKU<input name="sku" required maxlength="30"></label><label>Nombre<input name="nombre" required maxlength="100"></label><label>Cantidad inicial<input name="cantidad" type="number" min="0" step="1" required></label><button>Registrar producto</button></form></section>
<section><h2>Movimiento de existencias</h2><form id="mov"><label>SKU<input name="sku" required></label><label>Cambio (+ entrada / − salida)<input name="cambio" type="number" step="1" required></label><button>Aplicar movimiento</button></form><p id="estado" role="status">Listo para registrar operaciones</p></section>
<section><h2>Existencias actuales</h2><table><thead><tr><th>SKU</th><th>Producto</th><th>Cantidad</th></tr></thead><tbody id="filas"></tbody></table></section>
<script>async function refresh(){const rows=await(await fetch('/api/productos')).json();const target=document.querySelector('#filas');target.replaceChildren();for(const row of rows){const tr=document.createElement('tr');for(const k of ['sku','nombre','cantidad']){const td=document.createElement('td');td.textContent=row[k];tr.append(td)}target.append(tr)}}for(const [id,url,key] of [['alta','/api/productos','cantidad'],['mov','/api/movimientos','cambio']]){document.getElementById(id).onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data[key]=Number(data[key]);try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const out=await r.json();document.querySelector('#estado').textContent=(r.ok?'Correcto: ':'Error: ')+(out.mensaje||out.error);await refresh()}catch{document.querySelector('#estado').textContent='No se pudo conectar con el servidor'}}}refresh();</script></html>
